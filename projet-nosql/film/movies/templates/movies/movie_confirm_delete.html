{% extends 'movies/base.html' %}
{% block content %}
<div style="height: 60vh; display: flex; align-items: center; justify-content: center;">
  <div style="background: var(--bg-card); padding: 40px; border-radius: 16px; text-align: center; max-width: 500px; border: 1px solid rgba(255,50,50,0.2); box-shadow: 0 20px 50px rgba(0,0,0,0.5);">
    
    <div style="font-size: 3rem; margin-bottom: 10px;">⚠️</div>
    <h1 style="margin-top: 0;">Delete Movie?</h1>
    <p style="color: var(--text-muted); font-size: 1.1rem; margin-bottom: 30px;">
      Are you sure you want to delete <strong>"{{ movie.title }}"</strong>?<br>
      This action cannot be undone.
    </p>

    <form method="post" style="display: flex; gap: 15px; justify-content: center;">
      {% csrf_token %}
      <button type="submit" style="background: #ef4444; color: white;">Yes, Delete</button>
      <a href="{% url 'movies:detail' movie.pk %}" 
         style="padding: 12px 24px; border-radius: 8px; background: #333; color: white;">
         Cancel
      </a>
    </form>
  </div>
</div>
{% endblock %}
