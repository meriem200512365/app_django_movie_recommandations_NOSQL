<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Film App</title>
  {% load static %}
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-body: #0f0f0f;
      --bg-card: rgba(26, 26, 26, 0.95); /* Slightly transparent cards */
      --bg-hover: #262626;
      --primary: #a855f7;
      --primary-hover: #9333ea;
      --text-main: #ffffff;
      --text-muted: #a3a3a3;
      --nav-bg: rgba(15, 15, 15, 0.85);
      --border-radius: 12px;
      --transition: all 0.3s ease;
    }

    * { box-sizing: border-box; }
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      margin: 0;
      padding-top: 70px;
      line-height: 1.6;
      min-height: 100vh;
      position: relative;
    }

    /* GLOBAL BACKGROUND TEXTURE */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: url('{% static "img/Background-size1920x1080-4e1694a6-75aa-4c36-9d4d-7fb6a3102005-bc5318781aad7f5c8520.png" %}') no-repeat;
      background-position: center;
      opacity: 0.15; /* Low opacity so it's just a texture */
      z-index: -1;
      filter: grayscale(80%) blur(2px); /* Blurred & desaturated for focus */
    }

    a { text-decoration: none; color: inherit; transition: var(--transition); }
    a:hover { color: var(--primary); }

    /* Navigation */
    header.site-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: var(--nav-bg);
      backdrop-filter: blur(12px);
      z-index: 1000;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      height: 70px;
      display: flex;
      align-items: center;
    }

    .nav-container {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand a {
      font-size: 1.5rem;
      font-weight: 800;
      background: linear-gradient(45deg, var(--primary), #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -1px;
    }

    .nav-links { display: flex; gap: 20px; align-items: center; }
    .nav-links a { font-size: 0.95rem; font-weight: 500; color: var(--text-muted); }
    .nav-links a:hover, .nav-links a.active { color: var(--text-main); }
    
    .btn-nav {
      background: var(--primary);
      padding: 8px 16px;
      border-radius: 6px;
      color: white !important;
      font-weight: 600;
    }
    .btn-nav:hover { background: var(--primary-hover); }

    /* Layout Containers */
    main { padding: 2rem 0; min-height: 80vh; }
    .container { max-width: 1400px; margin: 0 auto; padding: 0 20px; }

    /* Movie Grid (Global) */
    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 24px;
      margin-top: 20px;
    }

    .movie-card {
      background: var(--bg-card); /* Now uses the semi-transparent card bg */
      border-radius: var(--border-radius);
      overflow: hidden;
      position: relative;
      transition: var(--transition);
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .movie-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.4); border-color: rgba(168, 85, 247, 0.3); }

    .movie-card img.poster {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      background: #222;
    }
    
    .movie-card h3 {
      font-size: 1rem;
      margin: 10px 0 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-main);
    }

    .movie-meta { font-size: 0.85rem; color: var(--text-muted); }

    /* Headings */
    h1, h2, h3 { color: var(--text-main); margin-bottom: 1rem; }
    h1 { font-size: 2.5rem; font-weight: 700; }

    /* Forms */
    input, textarea, select {
      background: #1a1a1a;
      border: 1px solid #333;
      color: white;
      padding: 12px;
      border-radius: 8px;
      width: 100%;
      display: block;
      margin-bottom: 15px;
    }
    input:focus, textarea:focus { outline: 2px solid var(--primary); border-color: transparent; }
    
    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 1rem;
    }
    button:hover { background: var(--primary-hover); }

  </style>
</head>
<body>
  <header class="site-header">
    <div class="nav-container">
      <div class="brand"><a href="{% url 'movies:home' %}">FilmApp</a></div>
      <nav class="nav-links">
        <a href="{% url 'movies:home' %}">Home</a>
        <a href="{% url 'movies:list' %}">Explore</a>
        <a href="{% url 'movies:recommendations_dashboard' %}">For You</a>
        {% if user.is_authenticated %}
          <a href="{% url 'movies:watchlist' %}">Watchlist</a>
          <a href="{% url 'movies:user_dashboard' %}">Profile</a>
          <a href="{% url 'movies:logout' %}" style="margin-left:10px; color:#fff;">Logout</a>
        {% else %}
          <a href="{% url 'movies:login' %}">Login</a>
          <a href="{% url 'movies:register' %}" class="btn-nav">Sign Up</a>
        {% endif %}
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </main>
</body>
</html>
