{% extends 'movies/base.html' %}
{% block content %}
<div style="max-width: 700px; margin: 40px auto; background: var(--bg-card); padding: 40px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 20px 40px rgba(0,0,0,0.3);">
  
  <h1 style="text-align: center; margin-bottom: 30px;">{% if movie %}Edit Movie{% else %}Add New Movie{% endif %}</h1>
  
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    
    <div style="display: flex; flex-direction: column; gap: 15px;">
      {{ form.as_p }}
    </div>

    <div style="margin-top: 30px; display: flex; gap: 15px;">
      <button type="submit" style="flex: 1;">Save Changes</button>
      <a href="{% if movie %}{% url 'movies:detail' movie.pk %}{% else %}{% url 'movies:list' %}{% endif %}" 
         style="flex: 1; text-align: center; padding: 12px 24px; border-radius: 8px; border: 1px solid #444; color: #ccc;">
         Cancel
      </a>
    </div>
  </form>
</div>
{% endblock %}
